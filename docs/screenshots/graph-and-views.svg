<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Tourmaline graph and database-style views</title>
  <desc id="desc">A dark interface showing a linked-note graph next to a saved database-style view table.</desc>
