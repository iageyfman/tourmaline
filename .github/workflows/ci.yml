name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholder so the build can construct the Postgres pool.
          # No network calls happen at build time; real values are never needed in CI.
          DATABASE_URL: postgresql://tourmaline:tourmaline@localhost:5432/tourmaline
